name: Lint and vulnerabilities
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: staticcheck
        run: |
          for module in . sdk sources/* integration; do
            [ -f "$module/go.mod" ] || continue
            (cd "$module" && go run honnef.co/go/tools/cmd/staticcheck@latest ./...)
          done
      - name: govulncheck
        run: |
          for module in . sdk sources/* integration; do
            [ -f "$module/go.mod" ] || continue
            (cd "$module" && go run golang.org/x/vuln/cmd/govulncheck@latest ./...)
          done
