# Copy to dug.yaml (read from the working directory) or pass --config PATH.
# Keys are flag names. Precedence: flag default < environment < this file < flags.

bucket: artifact-corpus
# endpoint: http://localhost:9000   # omit for AWS S3
prefix: dug
concurrency: 8
attempts: 3

registries:
  wordpress:
    options:
      slugs: [akismet, wordpress-seo]
  chrome:
    plugin-url: http://127.0.0.1:7782
    options:
      ids: [EXTENSION_ID]

# Events: discovered/downloaded/skipped/failed, delivered in the background.
# events-db: findings.db
# events-webhook: https://example.com/hooks/dug   # secret: DUG_EVENTS_WEBHOOK_SECRET
# events-batch-size: 500
# events-flush-interval: 2s
# events-buffer: 10000
